<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DataOTA · 数据飞轮控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 12l8-4 8 4-8 4-8-4z' fill='white' opacity='.95'/%3E%3Cpath d='M8 17l8 4 8-4' stroke='white' stroke-width='2' fill='none' opacity='.75' stroke-linecap='round'/%3E%3Cpath d='M8 22l8 4 8-4' stroke='white' stroke-width='2' fill='none' opacity='.45' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M6 11.5 16 7l10 4.5-10 4.5-10-4.5Z" fill="currentColor" opacity=".95"/><path d="M6 17l10 4.5L26 17" fill="none" stroke="currentColor" stroke-width="2" opacity=".7" stroke-linecap="round"/><path d="M6 22.2 16 26.7l10-4.5" fill="none" stroke="currentColor" stroke-width="2" opacity=".42" stroke-linecap="round"/></svg>
        </div>
        <div class="brand-text">
          <strong>DataOTA</strong>
          <span>数据飞轮控制台</span>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="主导航"></nav>
      <div class="sidebar-foot">
        <div class="status-dot" id="side-status"><i></i><span>连接中…</span></div>
        <div class="side-version">v0.1.0 · Demo</div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" title="菜单" aria-label="菜单">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="crumb" id="crumb">
          <span class="crumb-root">DataOTA</span>
          <svg viewBox="0 0 24 24" class="crumb-sep"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          <span id="crumb-page">运行总览</span>
        </div>
        <div class="topbar-spacer"></div>
        <div class="workdir-pill" id="workdir-pill" title="当前工作目录">
          <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2.5h7A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-10Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          <span id="workdir-text">runs/demo</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="refresh-btn" title="刷新数据">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>刷新</span>
        </button>
        <button class="btn btn-primary btn-sm" id="run-btn" title="运行一轮或多轮闭环">
          <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor"/></svg>
          <span>运行闭环</span>
        </button>
        <button class="icon-btn" id="theme-btn" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" class="ico-sun"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" class="ico-moon"><path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.4 8.4 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <main class="view" id="view" tabindex="-1">
        <div class="boot">
          <div class="spinner"></div>
          <p>正在读取运行产物…</p>
        </div>
      </main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="详情面板">
    <header class="drawer-head">
      <div>
        <div class="drawer-eyebrow" id="drawer-eyebrow"></div>
        <h2 id="drawer-title">详情</h2>
      </div>
      <button class="icon-btn" id="drawer-close" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="modal-backdrop" id="run-modal" hidden>
    <form class="modal" id="run-form">
      <header class="modal-head">
        <h2>运行闭环</h2>
        <button type="button" class="icon-btn" data-close-modal aria-label="关闭">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="modal-body">
        <p class="modal-note">使用 <code>configs/demo.toml</code> 中的实现与阈值：检测模型 / 世界模型 / 几何门禁在渲染的真实图像上运行（需 numpy + Pillow，缺依赖自动回退 mock）。已有归档时自动从下一轮续跑；勾选清空则从 R1 重新开始。每轮约 20–40 秒。</p>
        <label class="field">
          <span>轮次</span>
          <input type="number" name="rounds" min="1" max="30" value="3">
        </label>
        <label class="field">
          <span>种子数据量</span>
          <input type="number" name="seed_size" min="0" max="500" value="60">
        </label>
        <label class="check">
          <input type="checkbox" name="include_inbox" value="1" checked>
          <span>并入收件箱上传 <em>（数据接入页上传的图像，作为第 1 轮的 A1 用户上传源）</em></span>
        </label>
        <label class="check">
          <input type="checkbox" name="fresh" value="1">
          <span>清空工作目录后重跑 <em>（会删除当前全部产物）</em></span>
        </label>
        <div class="run-log" id="run-log" hidden></div>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close-modal>取消</button>
        <button type="submit" class="btn btn-primary" id="run-submit">开始运行</button>
      </footer>
    </form>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
